services:
  api:
    build:
      context: .
      network: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your PostgreSQL/Supabase connection string}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "python -m backend.init_db && uvicorn backend.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    build:
      context: .
      network: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your PostgreSQL/Supabase connection string}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "backend.worker"]
    depends_on:
      api:
        condition: service_healthy
  frontend:
    build:
      context: .
      network: host
    environment:
      API_BASE: http://api:8000
    command: ["streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0"]
    ports:
      - "127.0.0.1:8501:8501"
    depends_on: [api]
  redis:
    image: redis:7-alpine
