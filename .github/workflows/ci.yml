name: Checks
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi sqlalchemy pgvector pydantic-settings "pydantic[email]" PyJWT "pwdlib[argon2]" python-multipart httpx requests "streamlit>=1.41,<2"
      - run: python -m compileall -q backend frontend streamlit_app.py
      - run: python -m unittest discover -s tests -v
